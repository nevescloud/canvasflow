name: Bug
description: Something is wrong, missing, or broken.
labels: [bug]
body:
  - type: textarea
    id: message
    attributes:
      label: What happened?
      description: What you did, what you expected, what you saw instead. Leave out your name, email, and school login.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: CanvasFlow version
      description: Settings, under Troubleshooting, shows it. Optional.
      placeholder: 1.8.1
  - type: input
    id: school
    attributes:
      label: Canvas address
      description: The Canvas domain, so the bug can be reproduced. Optional.
      placeholder: canvas.example.edu
